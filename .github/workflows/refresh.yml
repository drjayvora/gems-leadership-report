name: Refresh report

# Rebuilds the encrypted report from the CRM and the agency sheets, then commits docs/ (served by GitHub Pages).
# Needs repository secrets: FRAPPE_TOKEN ("token key:secret"), CENTRAL_REPS (JSON {"email": "Name"}), LEADERSHIP_PASSWORD,
# ECHOVME_SHEET (the Google Sheet ID; the sheet must be viewable by link).
on:
  schedule:
    - cron: "30 2-13 * * *"   # hourly, 08:00 to 19:00 IST (GitHub may run these late)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q cryptography openpyxl
      - name: Refresh, encrypt and commit
        env:
          FRAPPE_TOKEN: ${{ secrets.FRAPPE_TOKEN }}
          CENTRAL_REPS: ${{ secrets.CENTRAL_REPS }}
          LEADERSHIP_PASSWORD: ${{ secrets.LEADERSHIP_PASSWORD }}
          ECHOVME_SHEET: ${{ secrets.ECHOVME_SHEET }}
        run: |
          if [ -z "$LEADERSHIP_PASSWORD" ] || [ -z "$FRAPPE_TOKEN" ] || [ -z "$CENTRAL_REPS" ]; then
            echo "::notice::Secrets not set yet; skipping the refresh."; exit 0
          fi
          if [ -n "$ECHOVME_SHEET" ]; then python3 agencies/echovme.py; fi
          python3 build.py && python3 publish.py
          git config user.name "report-bot"; git config user.email "report-bot@users.noreply.github.com"
          git add docs
          git diff --cached --quiet || (git commit -m "Refresh report data" && git push)
